<div class="container-fluid p-0 d-flex flex-column align-items-center bg-light">

    <!-- Immagine principale -->
    <div class="border-bottom border-black w-100">
        <img src="../../../assets/images/RENT ONE_page-0001.jpg" alt="Immagine rent" class="img-fluid w-100">
    </div>

    <!-- Pulsante Whatsapp -->
    <div class="w-100 d-flex justify-content-center border-bottom border-black py-3">
        <button (click)="apriWhatsApp()"
            class="d-flex flex-row bg-button-whatsapp w-75 w-md-75 border-0 rounded justify-content-center align-items-center p-2 gap-2">
            <span class="text-white fs-4 fs-md-2 font-custom-kenyan">Whatsapp</span>
            <img src="../../../assets/whatsapp.png" alt="whatsapp" style="max-height: 32px;">
        </button>
    </div>

    <!-- Testo promozionale -->
    <div
        class="w-100 w-md-75 py-3 d-flex flex-column gap-2 border-black border-bottom justify-content-center align-items-center text-center">
        <span class="fs-6 fs-md-5 w-75 font-custom-kenyan lett-spacing">
            Hai bisogno di un passaggio per l’aeroporto o vuoi esplorare la città senza pensieri?<br>
            Offriamo servizio navetta e tour su misura per vivere al meglio la tua esperienza!
        </span>
        <div class="w-75 ">
            <button (click)="apriWhatsAppPrenotaNavetta()" class="btn btn-dark rounded w-100 p-2">
                <span class="text-white font-custom-kenyan fs-4 fs-md-2">
                    Prenota!
                </span>
            </button>
        </div>
    </div>

    <!-- card -->
    <div class="w-100 d-flex flex-column align-items-center py-3 gap-3 border border-1 border-black">
        <div class="text-center">
            <h1 class="font-custom-kenyan fs-1">Veicoli</h1>
        </div>

        <!-- Responsive Row -->
        <div class="row w-75 justify-content-center g-3">
            <div class="col-12 col-sm-6 col-md-4" *ngFor="let veicoli of listaVeicoli">
                <div class="border border-1 border-black rounded h-100 d-flex flex-column bg-white">
                    <div>
                        <img [src]="veicoli.image" alt="" class="img-fluid w-100 rounded-top" style="max-height:300px;">
                    </div>
                    <div class="w-100 d-flex flex-column align-items-center">
                        <span class="w-75 font-custom-bebas">
                            {{veicoli.name}}
                        </span>
                        <span class="w-75 font-custom-bebas">
                            {{veicoli.cambio}}
                        </span>
                        <span class="w-75 font-custom-bebas">
                            {{veicoli.tipoCarburante}}
                        </span>
                    </div>
                    <div class="w-100 d-flex justify-content-center py-1 mt-auto">
                        <button (click)="apriWhatsAppVeciolo(veicoli)" class="w-75 btn btn-primary d-flex flex-column">
                            <span class="fs-5 font-custom-kenyan">{{veicoli.prezzo}}</span>
                            <span class="fs-5 font-custom-kenyan">Prenota</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
