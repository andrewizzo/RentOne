
<div class="container-fluid p-0 d-flex flex-column align-items-center bg-light">

    <!-- Immagine principale -->
    <div class="border-bottom border-black w-100">
        <img src="../../../assets/images/RENT ONE_page-0001.jpg" alt="Immagine rent" class="img-fluid w-100">
    </div>

    <!-- Pulsante Whatsapp -->
    <div class="w-100 d-flex justify-content-center border-bottom border-black py-3">
        <button
            class="d-flex flex-row bg-button-whatsapp w-75 w-md-75 border-0 rounded justify-content-center align-items-center p-2 gap-2">
            <span class="text-white fs-4 fs-md-2">Whatsapp</span>
            <img src="../../../assets/whatsapp.png" alt="whatsapp" style="max-height: 32px;">
        </button>
    </div>

    <!-- Testo promozionale -->
    <div
        class="w-100 w-md-75 py-3 d-flex flex-column gap-2 border-black border-bottom justify-content-center align-items-center text-center">
        <span class="fs-6 fs-md-5 w-75">
            Hai bisogno di un passaggio per l’aeroporto o vuoi esplorare la città senza pensieri?<br>
            Offriamo servizio navetta e tour su misura per vivere al meglio la tua esperienza!
        </span>
        <div class="w-75 ">
            <button class="btn btn-dark rounded w-100">
                <span class="text-white fs-4">
                    Prenota!
                </span>
            </button>
        </div>
    </div>

    <!-- card -->
    <div class="w-100 d-flex flex-column align-items-center py-3 gap-2 border border-1 border-black ">
        <div>
            <h2>Veicoli</h2>
        </div>
        <div *ngFor="let veicoli of listaVeicoli" class="w-75 border border-1 border-black rounded bg-custom">
            <div>
                <img [src]="veicoli.image" alt="" class="img-fluid w-100 rounded-top" style="max-height:300px;">
            </div>
            <div class="w-100 py-1 d-flex flex-column align-items-center">
                <span class="w-75 text-white">
                    {{veicoli.name}}
                </span>
                <span class="w-75 text-white">
                    {{veicoli.cambio}}
                </span>
                <span class="w-75 text-white">
                    {{veicoli.tipoCarburante}}
                </span>
            </div>

            <div class="w-100 d-flex justify-content-center py-1">
                <button class="w-75 btn btn-primary d-flex flex-column">
                    <span class="fs-5">{{veicoli.prezzo}}</span>
                    <span class="fs-5">Prenota</span>
                </button>
            </div>

        </div>
    </div>

    <!-- form -->
     <div class="w-100 d-flex flex-column align-items-center py-3 gap-2">
        <div>
            <h2>Contattaci tramite Email</h2>
        </div>
        <div class="w-75 bg-custom rounded d-flex flex-column align-items-center p-2 gap-2">
            <div class="w-100">
                <input type="text" name="" id="" class="w-100" placeholder="Nome e Cognome">
            </div>
            <div class="w-100">
                <input type="email" class="w-100" placeholder="E-mail">
            </div>
            <div class="w-100">
                <textarea name="" id="" class="w-100" placeholder="Contattaci..."></textarea>
            </div>
            <div class="w-100 d-flex justify-content-center">
                <button class="btn btn-primary w-75">
                    <span>Invia</span>
                </button>
            </div>
        </div>
     </div>
</div>
